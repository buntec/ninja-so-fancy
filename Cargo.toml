[package]
name = "ninja-so-fancy"
version = "0.0.3"
edition = "2024"
description = "ninja build output for humans"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
indicatif = { version = "0.17", features = ["tokio"] }
console = "0.15"
regex = "1"
sysinfo = "0.35"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
